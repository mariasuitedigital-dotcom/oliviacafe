name: Recordatorios coworking

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint
        run: |
          curl -f -X GET "https://oliviacafe-delta.vercel.app/api/push/coworking-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
